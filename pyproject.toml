[project]
name = "awesome-rag-experiments"
version = "1.0.0"
description = "Experiments and prototypes for retrieval-augmented generation (RAG)"
readme = "README.md"
authors = [
    { name = "ysskrishna", email = "sivasaikrishnassk@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "llm",
    "embeddings",
    "vector-search",
    "langchain",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ysskrishna/awesome-rag-experiments"
Repository = "https://github.com/ysskrishna/awesome-rag-experiments"
Issues = "https://github.com/ysskrishna/awesome-rag-experiments/issues"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
