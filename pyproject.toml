[project]
name = "awesome-llm-experiments"
version = "1.0.0"
description = "Runnable notebooks exploring LLM-related patterns (RAG, embeddings, vector search, and more)."
readme = "README.md"
authors = [
    { name = "ysskrishna", email = "sivasaikrishnassk@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "llm",
    "rag",
    "retrieval-augmented-generation",
    "llm",
    "embeddings",
    "vector-search",
    "langchain",
]
dependencies = [
    "chromadb>=0.5",
    "langchain-chroma>=0.2",
    "langchain-community>=0.3,<0.4",
    "langchain-core>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-text-splitters>=0.3",
    "sentence-transformers>=3.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "pandas>=2.0",
    "pypdf>=5.0",
    "ragas>=0.2",
    "langchain-openai>=0.2",
    "openai>=1.0",
    "pillow>=10.0",
]

[tool.uv]
package = false

[project.urls]
Homepage = "https://github.com/ysskrishna/awesome-llm-experiments"
Repository = "https://github.com/ysskrishna/awesome-llm-experiments"
Issues = "https://github.com/ysskrishna/awesome-llm-experiments/issues"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
